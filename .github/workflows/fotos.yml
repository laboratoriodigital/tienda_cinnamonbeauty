# La vía rápida de lo que cambia el comercio: sus fotos y sus precios.
#
# Subir una foto o cambiar un precio son acciones del COMERCIO, y el comercio no
# entiende de pull requests ni tiene por qué esperar al lunes. Este flujo mira
# el Drive y la hoja cada cuatro horas y, si hay algo nuevo, lo publica solo.
#
# EL CATÁLOGO ENTRÓ AQUÍ POR UNA DEUDA QUE DEJÓ EL SPRINT 2. Al hornear el
# catálogo dentro del sitio, un cambio de precio dejó de estar en la calle en
# diez segundos y pasó a esperar un despliegue. Eso se aceptó a cambio de que la
# vitrina no compita con el checkout por las 30 ejecuciones de Apps Script —pero
# aceptarlo NO era dejar al comerciante vendiendo al precio de la semana pasada
# hasta que alguien se acordara de disparar `montaje` a mano. Cuatro horas es el
# techo, y el «Publicar ahora» del menú (Sprint 4) será el suelo.
#
# El nombre del flujo se queda en `fotos` a propósito: renombrarlo arrastra doce
# menciones en la documentación, y el Sprint 4 probablemente lo reemplaza entero
# cuando el maestro pueda disparar su propio despliegue.
#
# POR QUÉ ESTO SÍ SE FUSIONA SOLO Y EL OTRO NO
# `montaje` puede reescribir el <head>, la política de seguridad y SCRIPT_URL:
# si la configuración de la hoja quedó mal, la tienda se cae. Por eso ahí hay
# una persona en el medio.
#
# Una foto no puede hacer eso. Lo peor que pasa si el comercio sube una foto
# fea o equivocada es que se vea una foto fea: no toca precios, no toca la
# política de seguridad, no toca el código. El riesgo es reversible con otra
# foto, y el costo de la aprobación —seis días de espera— es mayor que el daño.
#
# El catálogo horneado tampoco: es un volcado de lo que YA decide la hoja, y la
# hoja la escribe el comerciante sin pedirle permiso a nadie. Publicarlo no le
# da a nadie un poder que no tuviera; lo que hace es que lo que ya decidió se
# vea. Y el precio del pedido sigue saliendo del sello, no de este archivo.
#
# Y no se confía en esa promesa: el paso "solo fotos" la COMPRUEBA. Si el
# cambio toca un solo archivo fuera de publicar/fotos/, no se fusiona nada y
# queda un pull request esperando a una persona.
#
# Nota sobre Actions: lo que empuja el GITHUB_TOKEN no dispara otros flujos,
# así que `pruebas` no vuelve a correr sobre este commit. Por eso las baterías
# corren aquí dentro, antes de fusionar. Cloudflare sí despliega: su
# integración es un webhook del repositorio, no un flujo de Actions.
name: fotos

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
    inputs:
      aprobacion:
        description: 'Cómo publicarlas'
        type: choice
        default: automatica
        options: [automatica, con-pull-request]

permissions:
  contents: write
  pull-requests: write

# Nunca a la vez que `montaje`: los dos escriben en publicar/.
concurrency:
  group: tienda-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # LO QUE ESTE FLUJO PUEDE PUBLICAR, ESCRITO UNA SOLA VEZ.
    #
    # Estaba escrito dos veces y se separaron. El guardia permitía
    # `publicar/fotos/` Y `publicar/catalogo.json`; el paso que hace el commit
    # hacía `git add publicar/fotos/` a secas. Mientras el comercio solo subía
    # fotos los dos decían lo mismo. El día que dio de baja un producto —un
    # cambio que solo toca el catálogo— el guardia dijo «adelante», el `git add`
    # no puso nada en el índice, `git commit` salió con código 1 y el flujo se
    # cayó con «no changes added to commit». Efecto para el comerciante: el
    # producto inactivo seguía a la venta y la página seguía sirviendo el
    # catálogo de antes, sin que nadie viera un error en ningún sitio.
    #
    # Es el patrón 2 de la bitácora: dos implementaciones del mismo criterio,
    # una se queda atrás. La cura no es acordarse de tocar las dos: es que haya
    # una. Los dos pasos leen de aquí, y `montaje.js` comprueba que ninguno de
    # los dos vuelva a escribir rutas por su cuenta.
    #
    # ── Y DESDE LA 2.14.0, TAMBIÉN `publicar/index.html` ──────────────────
    # «Publicar ahora» es el único botón que el COMERCIO puede apretar, y el
    # mensaje que le sale promete «se revisan los datos». Pero este flujo solo
    # publicaba las fotos y el catálogo: todo lo que se escribe en la pestaña
    # Configuración —el título del sitio, el nombre, los colores, los textos de
    # la portada, el WhatsApp— vive en el `<head>` y en las constantes del
    # index.html, y por aquí no pasaba nunca.
    #
    # El comerciante cambiaba el título de su tienda, apretaba el botón, leía
    # «tu tienda se está actualizando», y no cambiaba nada. Ningún error en
    # ninguna parte. Es el patrón 1: el fallo que funciona.
    env:
      PUBLICA: publicar/fotos publicar/catalogo.json publicar/index.html publicar/productos publicar/sitemap.xml publicar/robots.txt
      TRABAJADORES: 4

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: ¿Está configurada esta tienda?
        id: hay
        env:
          MAESTRO_URL: ${{ secrets.MAESTRO_URL }}
          MAESTRO_TOKEN: ${{ secrets.MAESTRO_TOKEN }}
        run: |
          if [ -z "$MAESTRO_URL" ] || [ -z "$MAESTRO_TOKEN" ]; then
            echo "Faltan los secretos MAESTRO_URL y MAESTRO_TOKEN." >> "$GITHUB_STEP_SUMMARY"
            echo "sigue=no" >> "$GITHUB_OUTPUT"
          else
            echo "sigue=si" >> "$GITHUB_OUTPUT"
          fi

      # ANTES DE MIRAR NADA: ¿esta hoja es la de este repositorio?
      # Publicar la hoja de un comercio en el sitio de otro no falla en ningún
      # sitio —el flujo corre en verde, el maestro contesta, Cloudflare
      # despliega— y desde el mostrador se ve como «subí una foto y no salió».
      - name: ¿Esta hoja es la de esta tienda?
        if: steps.hay.outputs.sigue == 'si'
        env:
          MAESTRO_URL: ${{ secrets.MAESTRO_URL }}
          MAESTRO_TOKEN: ${{ secrets.MAESTRO_TOKEN }}
        run: |
          set -o pipefail
          node montar/misma-tienda.mjs 2>&1 | tee /tmp/misma.txt || estado=$?
          {
            echo "### De qué tienda es la hoja"
            echo '```'
            cat /tmp/misma.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit ${estado:-0}

      # Lo primero es una sola llamada que casi siempre dice "nada nuevo". Así
      # una revisión cada cuatro horas cuesta veinte segundos, no cinco minutos.
      - name: ¿Hay fotos nuevas?
        if: steps.hay.outputs.sigue == 'si'
        id: mirar
        env:
          MAESTRO_URL: ${{ secrets.MAESTRO_URL }}
          MAESTRO_TOKEN: ${{ secrets.MAESTRO_TOKEN }}
        run: |
          fotos=no; catalogo=no; config=no; seo=no
          # Las tres consultas remotas son de solo lectura e independientes;
          # la cuarta revisión (SEO) es local. En paralelo el paso tarda lo que
          # tarde la más lenta, no la suma de latencias de Apps Script.
          node montar/traer-fotos.mjs       --revisar > /tmp/mirar-fotos.txt 2>&1 & pid_fotos=$!
          node montar/catalogo-estatico.mjs --revisar > /tmp/mirar-cat.txt   2>&1 & pid_catalogo=$!
          # Lo que el comercio escribe en la pestaña Configuración. Sin esta
          # línea, cambiar el título de la tienda y apretar «Publicar ahora»
          # contestaba «nada nuevo».
          node montar/preparar-index.mjs    --revisar > /tmp/mirar-cfg.txt   2>&1 & pid_config=$!
          node montar/sembrar-seo.mjs       --revisar > /tmp/mirar-seo.txt   2>&1 & pid_seo=$!

          if wait "$pid_fotos"; then :; else fotos=si; fi
          if wait "$pid_catalogo"; then :; else catalogo=si; fi
          if wait "$pid_config"; then :; else config=si; fi
          if wait "$pid_seo"; then :; else seo=si; fi

          # UN "NO" TIENE QUE MOSTRAR SU TRABAJO, y este no lo mostraba.
          # El comercio subió dos fotos al Drive, publicó, y este paso contestó
          # "nada nuevo" sin más. La respuesta estaba en el log —cuántas fotos
          # ve el maestro en la carpeta, y cuáles nombra la hoja sin tenerlas—
          # pero el resumen, que es lo único que se mira, no la traía.
          # El flujo `montaje` ya había aprendido esto; este se quedó fuera.
          # Ahora el detalle sale SIEMPRE, se haya decidido bajar o no.
          {
            if [ "$fotos" = "no" ] && [ "$catalogo" = "no" ] && [ "$config" = "no" ] && [ "$seo" = "no" ]; then
              echo "### Nada nuevo: ni fotos en el Drive, ni cambios en la hoja"
              echo ""
              echo "Si acabas de subir fotos y esto dice que no hay nada, la respuesta"
              echo "está aquí abajo: mira cuántas ve el maestro en la carpeta y si la"
              echo "hoja nombra alguna que el Drive no tiene."
            else
              echo "### Hay novedades"
              echo ""
              echo "Fotos nuevas: **$fotos** · Catálogo desactualizado: **$catalogo**"
              echo "· Configuración cambiada: **$config** · SEO desactualizado: **$seo**"
            fi
            echo ""
            echo "#### Lo que vio en el Drive"
            echo '```'
            cat /tmp/mirar-fotos.txt 2>/dev/null || echo "(no llegó a mirar)"
            echo '```'
            echo "#### Lo que vio en la hoja"
            echo '```'
            cat /tmp/mirar-cat.txt 2>/dev/null || echo "(no llegó a mirar)"
            echo '```'
            echo "#### Lo que vio en la Configuración"
            echo '```'
            cat /tmp/mirar-cfg.txt 2>/dev/null || echo "(no llegó a mirar)"
            echo '```'
            echo "#### SEO horneado"
            echo '```'
            cat /tmp/mirar-seo.txt 2>/dev/null || echo "(no llegó a mirar)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$fotos" = "no" ] && [ "$catalogo" = "no" ] && [ "$config" = "no" ] && [ "$seo" = "no" ]; then
            echo "hay=no" >> "$GITHUB_OUTPUT"
          else
            echo "hay=si" >> "$GITHUB_OUTPUT"
          fi

      # El lock es el contrato real de dependencias y de la caché.
      - name: Caché de npm
        if: steps.mirar.outputs.hay == 'si'
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json', 'pruebas/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Dependencias
        if: steps.mirar.outputs.hay == 'si'
        run: npm ci --no-audit --no-fund

      - name: Bajarlas y convertirlas
        if: steps.mirar.outputs.hay == 'si'
        env:
          MAESTRO_URL: ${{ secrets.MAESTRO_URL }}
          MAESTRO_TOKEN: ${{ secrets.MAESTRO_TOKEN }}
        run: |
          set -o pipefail   # sin esto manda el código de tee y un fallo se pierde
          estado=0; fallo_fotos=0
          # EL <head> PRIMERO: es lo que el comercio acaba de cambiar en su hoja
          # y lo que antes no llegaba por aquí. Este SÍ es o todo o nada: un
          # <head> a medias es una tienda publicada y muda.
          node montar/preparar-index.mjs    2>&1 | tee /tmp/config.txt   || estado=$?

          # ── LAS FOTOS PUEDEN FALLAR SIN LLEVARSE LO DEMÁS ─────────────────
          # Pasó en la tienda tres: el comercio cambió el título, el <head> se
          # escribió bien, el catálogo estaba al día, el respaldo se repuso — y
          # el paso entero murió con código 1 porque UNA foto del Drive contestó
          # 404. No se publicó nada. El comerciante cambió su título, apretó el
          # botón, y lo que llegó fue una cruz roja.
          #
          # Una foto que no baja no invalida lo que el comercio escribió en su
          # hoja. Así que se sigue, se publica lo que sí está, y se DICE en
          # grande: un fallo que se traga en silencio es peor que uno que para.
          node montar/traer-fotos.mjs       2>&1 | tee /tmp/fotos.txt    || fallo_fotos=$?

          node montar/catalogo-estatico.mjs 2>&1 | tee /tmp/catalogo.txt || estado=$?
          # Y EL RESPALDO AL FINAL, que es una copia del catálogo que se acaba
          # de hornear. Antes de este flujo solo lo escribía `montaje`, así que
          # un cambio de precio publicado desde la hoja dejaba el respaldo del
          # archivo con los precios de la semana pasada.
          node montar/sembrar-respaldo.mjs  2>&1 | tee /tmp/respaldo.txt || estado=$?
          node montar/sembrar-seo.mjs       2>&1 | tee /tmp/seo.txt      || estado=$?

          if [ "$fallo_fotos" != "0" ]; then
            {
              echo "### ⚠ Las fotos no se pudieron traer"
              echo ""
              echo "Lo demás SÍ se publica: lo que el comercio cambió en su hoja"
              echo "—el título, el nombre, los colores, los textos, los precios—"
              echo "llega igual. Lo que no llega son las fotos nuevas del Drive."
              echo ""
              echo "El detalle está en el volcado de las fotos, aquí abajo."
              echo ""
              echo "Si vuelve a pasar en la siguiente corrida, no es un tropiezo:"
              echo "mira la pestaña **Errores** de la hoja y las **Ejecuciones**"
              echo "del proyecto del maestro."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Las fotos no se pudieron traer; se publica lo demás."
          fi
          # PASE LO QUE PASE, AL RESUMEN. Este paso se cayó una vez y averiguar
          # por qué costó ir a desplegar el log a mano. Un paso que falla sin
          # decir qué obliga a hacer arqueología.
          {
            echo "### La configuración de la hoja"
            echo '```'
            cat /tmp/config.txt 2>/dev/null || echo "(no llegó a correr)"
            echo '```'
            echo "### Las fotos"
            echo '```'
            cat /tmp/fotos.txt 2>/dev/null || echo "(no llegó a correr)"
            echo '```'
            echo "### El catálogo"
            echo '```'
            cat /tmp/catalogo.txt 2>/dev/null || echo "(no llegó a correr)"
            echo '```'
            echo "### El respaldo del index"
            echo '```'
            cat /tmp/respaldo.txt 2>/dev/null || echo "(no llegó a correr)"
            echo '```'
            echo "### SEO, sitemap y fichas"
            echo '```'
            cat /tmp/seo.txt 2>/dev/null || echo "(no llegó a correr)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $estado

      # La promesa de arriba, comprobada. No es confianza: es una lista.
      # Se fusiona solo lo que este flujo puede generar y nada más: las fotos y
      # el catálogo horneado. Si aparece cualquier otra cosa, se para y lo dice
      # — un flujo que fusiona solo tiene que saber exactamente qué fusiona.
      - name: Comprobar que SOLO cambió lo que este flujo publica
        if: steps.mirar.outputs.hay == 'si'
        id: solo
        run: |
          # Se le pide a git que liste lo que cambió EXCEPTO lo que este flujo
          # puede publicar. Lo que quede es, por definición, lo que no toca.
          excluir=""
          for ruta in $PUBLICA; do excluir="$excluir :(exclude)$ruta"; done
          fuera=$(git status --porcelain -- . $excluir)
          if [ -n "$fuera" ]; then
            {
              echo "### No se fusiona solo"
              echo ""
              echo "Cambió algo fuera de lo que este flujo publica ($PUBLICA):"
              echo '```'
              echo "$fuera"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "limpio=no" >> "$GITHUB_OUTPUT"
          else
            echo "limpio=si" >> "$GITHUB_OUTPUT"
          fi

      # Chromium pesa ~130 MB y no cambia entre corridas. Bajarlo entero cada
      # vez era minuto y medio de cada publicación, gastado en descargar
      # siempre lo mismo. `pruebas.yml` ya lo cacheaba; este flujo —el que de
      # verdad corre cada cuatro horas— se había quedado fuera.
      - name: Caché del navegador
        if: steps.mirar.outputs.hay == 'si'
        id: cache-navegador
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pruebas/package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Dependencias de las pruebas
        if: steps.mirar.outputs.hay == 'si'
        run: cd pruebas && npm ci --no-audit --no-fund

      - name: Navegador para las pruebas
        if: steps.mirar.outputs.hay == 'si' && steps.cache-navegador.outputs.cache-hit != 'true'
        run: cd pruebas && npx playwright install --with-deps chromium

      - name: Guardia de publicación sobre los archivos generados
        if: steps.mirar.outputs.hay == 'si'
        run: |
          set -o pipefail
          cd pruebas
          bash ./publicacion.sh 2>&1 | tee /tmp/pruebas.txt || estado=$?
          bash ./resumir-publicacion.sh /tmp/pruebas.txt "${estado:-0}"
          exit ${estado:-0}

      - name: Publicar
        if: steps.mirar.outputs.hay == 'si'
        env:
          GH_TOKEN: ${{ github.token }}
          AUTO: ${{ steps.solo.outputs.limpio == 'si' && inputs.aprobacion != 'con-pull-request' }}
        run: |
          git config user.name  "montaje"
          git config user.email "noreply@github.com"
          rama="fotos/nuevas-$(date +%Y%m%d-%H%M)"

          # ── LA RAMA SE HACE SOBRE EL `main` DE AHORA, NO SOBRE EL DEL ARRANQUE ──
          # Este flujo tardaba cuatro minutos entre el checkout y el commit, y en
          # ese rato `main` puede haberse movido —normalmente por la corrida
          # ANTERIOR de este mismo flujo—. La rama salía del commit viejo y el
          # pull request chocaba: «Pull Request has merge conflicts».
          #
          # Y el conflicto era en `publicar/catalogo.json`, que es un archivo
          # GENERADO. Un conflicto ahí no tiene nada que decidir: la versión
          # buena es siempre la que se acaba de hornear desde la hoja, porque
          # la hoja es la fuente. Fusionar a mano dos horneadas es elegir entre
          # dos copias de lo mismo con distinta hora.
          #
          # Así que no se fusiona: se REHACE. Se guarda lo horneado, la rama se
          # planta sobre el `main` de este instante, y lo horneado se vuelve a
          # poner encima. La rama queda siempre a un commit de `main` y el
          # conflicto deja de ser posible.
          # LO QUE SE GUARDA Y SE REPONE SALE DE $PUBLICA, NO DE UNA LISTA AQUÍ.
          # Estaba escrito a mano y nombraba dos de las tres rutas: se guardaban
          # `publicar/fotos` y `publicar/catalogo.json`, y el `reset --hard` de
          # abajo se llevaba por delante el `publicar/index.html` que el paso
          # anterior acababa de escribir desde la hoja. Efecto: el comercio
          # cambiaba el título de su tienda, el flujo decía que había novedades,
          # publicaba las fotos y el catálogo, y el título no llegaba nunca.
          # Es el patrón 2 por tercera vez en este mismo archivo, y por tercera
          # vez la cura es que haya UNA lista.
          guardado=$(mktemp -d)
          for ruta in $PUBLICA; do
            [ -e "$ruta" ] || continue
            mkdir -p "$guardado/$(dirname "$ruta")"
            cp -r "$ruta" "$guardado/$(dirname "$ruta")/"
          done

          git fetch --quiet origin main
          git switch --quiet -c "$rama"
          git reset --hard --quiet FETCH_HEAD

          for ruta in $PUBLICA; do
            [ -e "$guardado/$ruta" ] || continue
            rm -rf "$ruta"
            mkdir -p "$(dirname "$ruta")"
            cp -r "$guardado/$ruta" "$(dirname "$ruta")/"
          done
          rm -rf "$guardado"

          # ── Y LOS PULL REQUESTS DEL BOT QUE QUEDARON ABIERTOS, SE CIERRAN ──
          # Cada corrida abre el suyo. Si uno anterior no se fusionó —porque
          # falló, o porque se pidió revisión— se queda ahí, y dos ramas que
          # rehacen el mismo archivo generado no pueden convivir: la segunda
          # choca contra la primera pase lo que pase. El que vale es el último,
          # que es el que trae lo que dice la hoja AHORA.
          for viejo in $(gh pr list --state open --json number,headRefName \
                           --jq '.[] | select(.headRefName | startswith("fotos/nuevas-")) | .number'); do
            gh pr close "$viejo" --delete-branch \
               --comment "Lo reemplaza una horneada más nueva del catálogo. El archivo es generado: la versión buena es siempre la última que salió de la hoja." \
               && echo "  · cerrado el pull request #$viejo, que quedó atrás"
          done

          # -A y no a secas: cuando el comercio BORRA una foto del Drive, el
          # cambio es un archivo que desaparece, y `git add <dir>` sin -A no
          # apunta los borrados en versiones viejas de git.
          git add -A -- $PUBLICA

          # SI NO HAY NADA QUE COMMITEAR, DECIRLO. `git commit` sin índice sale
          # con código 1 y el mensaje «no changes added to commit», que en el
          # log de Actions parece un fallo de git y es otra cosa: el paso que
          # decidió que había novedades y el que las junta no vieron lo mismo.
          if git diff --cached --quiet; then
            {
              echo "### Se dijo que había novedades y no quedó nada que publicar"
              echo ""
              echo "El paso «¿Hay fotos nuevas?» dijo que sí, pero después de"
              echo "bajar y hornear no hay ningún cambio en \`$PUBLICA\`."
              echo "Eso no es un fallo de git: es que los dos pasos no están"
              echo "mirando lo mismo. Mira los dos volcados de arriba."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Nada que publicar pese a haber detectado novedades."
            exit 1
          fi

          # QUÉ TRAE ESTE COMMIT, DICHO POR EL COMMIT.
          # El título era siempre «fotos nuevas del comercio», dijera lo que
          # dijera el contenido: un cambio de precio llegaba a `main` anunciado
          # como una foto. Quien abre el historial para averiguar cuándo cambió
          # un precio no encuentra nada. Ahora el rótulo lo dicta el índice.
          nfotos=$(git diff --cached --name-only -- publicar/fotos \
                   | grep -v '/origen\.json$' | wc -l | tr -d ' ')
          ncat=$(git diff --cached --name-only -- publicar/catalogo.json | wc -l | tr -d ' ')
          nseo=$(git diff --cached --name-only -- publicar/productos publicar/sitemap.xml publicar/robots.txt | wc -l | tr -d ' ')
          if [ "$nfotos" -gt 0 ] && [ "$ncat" -gt 0 ]; then
            resumen="fotos del comercio y catálogo al día"
          elif [ "$nfotos" -gt 0 ]; then
            resumen="fotos nuevas del comercio"
          elif [ "$nseo" -gt 0 ] && [ "$ncat" -eq 0 ]; then
            resumen="SEO, sitemap y fichas al día"
          else
            resumen="catálogo al día: precios, altas y bajas"
          fi

          # El detalle sale de lo que IMPRIMIERON los dos scripts, no de una
          # frase escrita aquí: si mañana bajan una foto más o cambian tres
          # precios, el cuerpo lo dice sin tocar este archivo.
          # SI LAS FOTOS FALLARON, EL COMMIT LO DICE. El resumen del flujo se
          # mira el día que algo va mal; el historial se mira meses después,
          # cuando alguien pregunta por qué esa foto nunca apareció.
          sinFotos=""
          [ "$fallo_fotos" != "0" ] && sinFotos="Las fotos del Drive NO se pudieron traer en esta corrida."
          detalle=$(grep -E '^  [+-] ' /tmp/fotos.txt || true)
          movidos=$(grep -E '^(Catálogo horneado|Productos:|Fotos con medidas)' \
                    /tmp/catalogo.txt || true)

          git commit -m "feature/frontend: $resumen" \
                     -m "$sinFotos" -m "$detalle" -m "$movidos"

          # ── SI SE VA A FUSIONAR SOLO, NO SE ABRE PULL REQUEST ──────────────
          # Abrir uno y fusionarlo en el mismo segundo no era ceremonia inútil:
          # era una X roja garantizada. Un pull request abierto por el bot
          # dispara `pruebas`, y GitHub RETIENE esa corrida esperando la
          # aprobación de un mantenedor. `pruebas.yml` tiene una condición para
          # saltarse justo ese caso — y no sirve de nada, porque la retención
          # es de la CORRIDA: pasa antes de que se evalúe ninguna condición del
          # trabajo. Así que caducaba y dejaba una X en un pull request que ya
          # se había fusionado bien. Una marca roja que no significa nada es
          # peor que ninguna: enseña a no mirarlas.
          #
          # La guardia de publicación ya corrió sobre estos mismos bytes. El
          # pull request no añadía una sola comprobación. Se va directo a main.
          if [ "$AUTO" = "true" ]; then
            if git push --quiet origin "$rama":main; then
              echo "Publicado en \`main\`. Cloudflare despliega solo." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            # Si `main` está protegido, el push se rechaza y no es un fallo:
            # es que este repositorio pide pull request. Se hace, y se dice.
            echo "::warning::No se pudo publicar directo en main; va por pull request."
            {
              echo "### Va por pull request"
              echo ""
              echo "El push directo a \`main\` se rechazó — normalmente porque la"
              echo "rama está protegida. No se perdió nada: queda el pull request."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          git push -u origin "$rama"

          cuerpo="Lo que cambió el comercio desde su hoja y su carpeta de Drive."
          cuerpo+=$'\n\n### La configuración de la hoja\n```\n'
          cuerpo+="$(cat /tmp/config.txt 2>/dev/null || echo '(sin cambios)')"
          cuerpo+=$'\n```\n\n### Las fotos\n```\n'
          cuerpo+="$(cat /tmp/fotos.txt 2>/dev/null || echo '(sin cambios)')"
          cuerpo+=$'\n```\n\n### El catálogo\n```\n'
          cuerpo+="$(cat /tmp/catalogo.txt 2>/dev/null || echo '(sin cambios)')"
          cuerpo+=$'\n```\n\nLa guardia de publicación ya corrió sobre estos archivos.'
          gh pr create --base main --head "$rama" \
            --title "feature/frontend: $resumen" --body "$cuerpo"
          echo "Pull request abierto, esperando revisión." >> "$GITHUB_STEP_SUMMARY"
